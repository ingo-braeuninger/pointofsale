<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Point of Sale</title>
    <!-- transactions are persisted in localStorage under key "pos_transactions" -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.136/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.layout"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-xx-waitForTheme="init"
        data-sap-ui-resourceroots='{"pos": "./"}'
    ></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        /* ── Two-column shell ── */
        #posShell {
            display: flex;
            height: 100%;
            flex-direction: column;
        }
        #posHeader {
            flex: 0 0 auto;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            z-index: 10;
        }
        #posHeader h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #1f2328;
        }
        #posHeaderBtns { display: flex; gap: 8px; }
        #posBody {
            flex: 1 1 auto;
            display: flex;
            overflow: hidden;
        }

        /* ── Left: SAPUI5 catalog ── */
        #posCatalogWrap {
            flex: 0 0 60%;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
        }
        #posCatalogWrap.dimmed { opacity: .4; pointer-events: none; }
        .posProductTile { cursor: pointer; border-radius: 8px; }
        .posProductTile:hover { box-shadow: 0 4px 16px rgba(0,0,0,.18); }

        /* ── Right: order panel (pure HTML) ── */
        #posOrderWrap {
            flex: 0 0 40%;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e5e7eb;
            background: #fff;
            overflow: hidden;
        }
        #posOrderHeader {
            padding: 12px 16px 10px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 700;
            font-size: 14px;
            color: #1f2328;
            background: #f7f8fa;
            flex: 0 0 auto;
        }
        #posOrderList {
            flex: 1 1 auto;
            overflow-y: auto;
            font-family: -apple-system, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        /* item row */
        .pos-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .pos-item-info { flex: 1; min-width: 0; }
        .pos-item-name {
            font-weight: 600;
            color: #1f2328;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-item-meta { font-size: 11px; color: #57606a; margin-top: 2px; }
        .pos-item-price {
            font-weight: 700;
            color: #1f2328;
            white-space: nowrap;
            min-width: 56px;
            text-align: right;
        }
        .pos-cancel {
            background: #fff;
            border: 1px solid #cf222e;
            border-radius: 4px;
            color: #cf222e;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            cursor: pointer;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .pos-cancel:hover { background: #fff0ee; }

        /* empty state */
        .pos-empty {
            padding: 40px 20px;
            text-align: center;
            color: #8c959f;
            font-size: 13px;
            line-height: 1.6;
        }
        .pos-empty-icon { font-size: 32px; margin-bottom: 8px; }

        /* totals */
        #posOrderFooter {
            flex: 0 0 auto;
            border-top: 2px solid #e5e7eb;
            font-family: -apple-system, "Segoe UI", sans-serif;
        }
        .pos-total-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 16px;
            font-size: 13px;
            color: #57606a;
            background: #f7f8fa;
        }
        .pos-total-grand {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1d4ed8;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
        }
        .pos-total-grand-amount { font-size: 22px; letter-spacing: -.5px; }

        /* header buttons */
        .pos-btn {
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pos-btn-success  { background: #16a34a; color: #fff; }
        .pos-btn-success:hover { background: #15803d; }
        .pos-btn-danger   { background: #fff; border: 1px solid #cf222e; color: #cf222e; }
        .pos-btn-danger:hover { background: #fff0ee; }
        .pos-btn-primary  { background: #2563eb; color: #fff; }
        .pos-btn-primary:hover { background: #1d4ed8; }
        .pos-btn-default  { background: #f3f4f6; color: #1f2328; border: 1px solid #d1d5db; }
        .pos-btn-default:hover { background: #e5e7eb; }
        .pos-btn-new      { background: #0ea5e9; color: #fff; }
        .pos-btn-new:hover { background: #0284c7; }
        .pos-btn-analytics { background: #7c5cd8; color: #fff; }
        .pos-btn-analytics:hover { background: #6d3fc0; }
    </style>
</head>
<body>

<!-- ── Shell ── -->
<div id="posShell">

    <!-- Header -->
    <div id="posHeader">
        <h1>&#x1F6D2; Point of Sale</h1>
        <div id="posHeaderBtns">
            <button class="pos-btn pos-btn-analytics" onclick="window.open('analytics.html','_blank')">&#x1F4CA; Sales Analytics</button>
            <button class="pos-btn pos-btn-analytics" onclick="window.open('analytics-items.html','_blank')" style="background:#6d3fc0">&#x1F6D2; Item Analytics</button>
            <button class="pos-btn pos-btn-danger"  id="btnClear"  onclick="posClear()">&#x1F5D1; Clear</button>
            <button class="pos-btn pos-btn-success" id="btnTotal"  onclick="posTotal()">&#x2713; Total</button>
        </div>
    </div>

    <!-- Body -->
    <div id="posBody">

        <!-- Left: SAPUI5 product grid -->
        <div id="posCatalogWrap">
            <div id="sapCatalog"></div><!-- SAPUI5 mounts here -->
        </div>

        <!-- Right: order panel -->
        <div id="posOrderWrap">
            <div id="posOrderHeader">&#x1F4CB; Current Order &nbsp;<span id="posOrderCount" style="font-weight:400;color:#57606a;font-size:12px"></span></div>
            <div id="posOrderList">
                <div class="pos-empty">
                    <div class="pos-empty-icon">&#x1F6D2;</div>
                    Tap a product on the left<br>to add it to the order.
                </div>
            </div>
            <div id="posOrderFooter" style="display:none"></div>
        </div>

    </div>
</div>

<script>
"use strict";

/* ── Transaction persistence ─────────────────────────────────────────────── */
var TX_KEY = "pos_transactions";

function loadTransactions() {
    try { return JSON.parse(localStorage.getItem(TX_KEY) || "[]"); }
    catch (e) { return []; }
}

function saveTransaction(tx) {
    var all = loadTransactions();
    all.push(tx);
    try { localStorage.setItem(TX_KEY, JSON.stringify(all)); } catch (e) {}
}

/**
 * Save transaction to ./transactions/ via the local server (node server.js).
 * Falls back to a browser download if the server is not reachable.
 */
function saveTransactionFile(tx) {
    fetch("/save-transaction", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(tx)
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
        if (!data.ok) { throw new Error(data.error || "server error"); }
        console.log("Transaction saved → " + data.file);
    })
    .catch(function (err) {
        /* Server not running — fall back to browser download */
        console.warn("Server unavailable (" + err.message + "), downloading instead.");
        var blob = new Blob([JSON.stringify(tx, null, 2)], { type: "application/json" });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement("a");
        a.download = "transaction_" + tx.id + ".json";
        a.href     = url;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    });
}

/* ── State ──────────────────────────────────────────────────────────────── */
var aItems    = [];
var bFinished = false;
var currentTxId = null;

/* ── Helpers ────────────────────────────────────────────────────────────── */
function eur(v) { return "\u20ac" + (+v || 0).toFixed(2); }

function subtotal() {
    return aItems.reduce(function (s, i) { return s + i.subtotal; }, 0);
}

/* ── Build per-category tax breakdown from current cart ─────────────────── */
function taxBreakdown() {
    var buckets = {};
    aItems.forEach(function (item) {
        var key = item.category;
        if (!buckets[key]) { buckets[key] = { category: key, rate: item.taxRate, base: 0 }; }
        buckets[key].base += item.subtotal;
    });
    return Object.keys(buckets)
        .sort(function (a, b) { return buckets[b].rate - buckets[a].rate || a.localeCompare(b); })
        .map(function (key) {
            var b = buckets[key];
            return { label: "Tax " + b.category + " (" + Math.round(b.rate * 100) + "%)", amount: b.base * b.rate };
        });
}

/* ── Render order panel ─────────────────────────────────────────────────── */
function renderOrder() {
    var listEl   = document.getElementById("posOrderList");
    var footerEl = document.getElementById("posOrderFooter");
    var countEl  = document.getElementById("posOrderCount");

    /* count badge */
    var n = aItems.reduce(function (s, i) { return s + i.quantity; }, 0);
    countEl.textContent = n > 0 ? "(" + n + " item" + (n !== 1 ? "s" : "") + ")" : "";

    /* list */
    if (!aItems.length) {
        listEl.innerHTML =
            '<div class="pos-empty">' +
            '<div class="pos-empty-icon">&#x1F6D2;</div>' +
            'Tap a product on the left<br>to add it to the order.' +
            '</div>';
        footerEl.style.display = "none";
        return;
    }

    var html = "";
    aItems.forEach(function (item, idx) {
        html +=
            '<div class="pos-item">' +
              '<div class="pos-item-info">' +
                '<div class="pos-item-name">' +
                  '<span style="background:#e8f4fd;color:#1d4ed8;border-radius:4px;' +
                  'padding:1px 6px;font-size:12px;margin-right:6px;">' + item.quantity + '&times;</span>' +
                  item.name +
                '</div>' +
                '<div class="pos-item-meta">' + eur(item.price) + ' each &bull; ' +
                  item.category + ' &bull; ' + Math.round(item.taxRate * 100) + '% tax' +
                '</div>' +
              '</div>' +
              '<div class="pos-item-price">' + eur(item.subtotal) + '</div>' +
              (!bFinished
                ? '<button class="pos-cancel" onclick="posCancel(' + idx + ')">Cancel</button>'
                : '') +
            '</div>';
    });
    listEl.innerHTML = html;

    /* footer totals — one tax row per active category */
    var sub      = subtotal();
    var breakdown = taxBreakdown();
    var tot      = sub + breakdown.reduce(function (s, b) { return s + b.amount; }, 0);

    var taxRows = breakdown.map(function (b) {
        return '<div class="pos-total-row"><span>' + b.label + '</span><span>' + eur(b.amount) + '</span></div>';
    }).join("");

    footerEl.style.display = "block";
    footerEl.innerHTML =
        '<div class="pos-total-row"><span>Subtotal</span><span>' + eur(sub) + '</span></div>' +
        taxRows +
        '<div class="pos-total-grand">' +
          '<span>TOTAL</span>' +
          '<span class="pos-total-grand-amount">' + eur(tot) + '</span>' +
        '</div>';
}

/* ── Cancel one item row ────────────────────────────────────────────────── */
window.posCancel = function (idx) {
    aItems.splice(idx, 1);
    renderOrder();
};

/* ── Add item (called from tile press) ──────────────────────────────────── */
function addItem(p) {
    if (bFinished) { return; }
    var ex = aItems.find(function (i) { return i.id === p.id; });
    if (ex) {
        ex.quantity++;
        ex.subtotal = ex.price * ex.quantity;
    } else {
        aItems.push({ id: p.id, name: p.name, category: p.category,
                      price: p.price, taxRate: p.taxRate, quantity: 1, subtotal: p.price });
    }
    renderOrder();
}

/* ── Build transaction object ───────────────────────────────────────────── */
function buildTransaction() {
    var sub       = subtotal();
    var breakdown = taxBreakdown();
    var totalTax  = breakdown.reduce(function (s, b) { return s + b.amount; }, 0);
    var tot       = sub + totalTax;
    var now       = new Date();
    var pad       = function (n) { return String(n).padStart(2, "0"); };
    var id        = now.getFullYear() + "" +
                    pad(now.getMonth() + 1) + "" +
                    pad(now.getDate()) + "_" +
                    pad(now.getHours()) + "" +
                    pad(now.getMinutes()) + "" +
                    pad(now.getSeconds());
    return {
        id:           id,
        timestamp:    now.toISOString(),
        items: aItems.map(function (i) {
            return {
                id:       i.id,
                name:     i.name,
                category: i.category,
                price:    +i.price.toFixed(4),
                taxRate:  i.taxRate,
                quantity: i.quantity,
                subtotal: +i.subtotal.toFixed(4),
                taxAmount:+(i.subtotal * i.taxRate).toFixed(4)
            };
        }),
        subtotal:     +sub.toFixed(4),
        taxBreakdown: breakdown.map(function (b) {
            return { label: b.label, amount: +b.amount.toFixed(4) };
        }),
        totalTax:     +totalTax.toFixed(4),
        total:        +tot.toFixed(4)
    };
}

/* ── Header button: Total ───────────────────────────────────────────────── */
window.posTotal = function () {
    if (!aItems.length) { alert("Add items first."); return; }

    /* Build & persist the transaction */
    var tx = buildTransaction();
    currentTxId = tx.id;
    saveTransaction(tx);
    saveTransactionFile(tx);

    bFinished = true;
    document.getElementById("posCatalogWrap").classList.add("dimmed");
    renderOrder();
    document.getElementById("posHeaderBtns").innerHTML =
        '<button class="pos-btn pos-btn-analytics" onclick="window.open(\'analytics.html\',\'_blank\')">&#x1F4CA; Analytics</button>' +
        '<button class="pos-btn pos-btn-new"     onclick="posNewSale()">&#x2B; New Sale</button>' +
        '<button class="pos-btn pos-btn-default" onclick="posPrint()">&#x1F5A8; Print &amp; Save PDF</button>';
};

/* ── Header button: Clear ───────────────────────────────────────────────── */
window.posClear = function () {
    if (!aItems.length) { return; }
    if (!confirm("Clear the entire order?")) { return; }
    aItems = [];
    renderOrder();
};

/* ── Header button: New Sale ────────────────────────────────────────────── */
window.posNewSale = function () {
    bFinished   = false;
    aItems      = [];
    currentTxId = null;
    document.getElementById("posCatalogWrap").classList.remove("dimmed");
    renderOrder();
    document.getElementById("posHeaderBtns").innerHTML =
        '<button class="pos-btn pos-btn-analytics" onclick="window.open(\'analytics.html\',\'_blank\')">&#x1F4CA; Analytics</button>' +
        '<button class="pos-btn pos-btn-danger"  id="btnClear" onclick="posClear()">&#x1F5D1; Clear</button>' +
        '<button class="pos-btn pos-btn-success" id="btnTotal" onclick="posTotal()">&#x2713; Total</button>';
};

/* ── Print receipt (opens print dialog → Save as PDF) ───────────────────── */
window.posPrint = function () {
    if (!aItems.length) { alert("Nothing to print."); return; }
    var sub       = subtotal();
    var breakdown = taxBreakdown();
    var tot       = sub + breakdown.reduce(function (s, b) { return s + b.amount; }, 0);
    var txId      = currentTxId || "receipt";

    var rows = aItems.map(function (i) {
        var taxAmt = i.subtotal * i.taxRate;
        return "<tr><td>" + i.name + "</td>" +
               "<td style='text-align:center'>" + i.quantity + "</td>" +
               "<td style='text-align:right'>" + eur(i.price) + "</td>" +
               "<td style='text-align:center'>" + Math.round(i.taxRate * 100) + "%</td>" +
               "<td style='text-align:right'>" + eur(taxAmt) + "</td>" +
               "<td style='text-align:right'>" + eur(i.subtotal) + "</td></tr>";
    }).join("");

    var taxRows = breakdown.map(function (b) {
        return "<tr class='tax'><td colspan='5'>" + b.label + "</td><td style='text-align:right'>" + eur(b.amount) + "</td></tr>";
    }).join("");

    var w = window.open("", "_blank", "width=560,height=720");
    w.document.write(
        "<!DOCTYPE html><html><head><meta charset='UTF-8'>" +
        "<title>Receipt " + txId + "</title><style>" +
        "@media print{@page{size:A5;margin:12mm}}" +
        "body{font-family:monospace;font-size:13px;max-width:480px;margin:0 auto;padding:20px}" +
        "h2{text-align:center;margin-bottom:2px}" +
        ".sub{text-align:center;color:#666;font-size:11px;margin-bottom:4px}" +
        ".txid{text-align:center;color:#999;font-size:10px;margin-bottom:14px}" +
        "table{width:100%;border-collapse:collapse}" +
        "th{border-bottom:2px solid #000;padding:4px 2px;text-align:left;font-size:11px}" +
        "td{padding:4px 2px;border-bottom:1px dotted #ccc;font-size:12px}" +
        ".tot td{border-top:2px solid #000;font-weight:bold;border-bottom:none}" +
        ".tax td{border-bottom:none;color:#555}" +
        ".ty{text-align:center;margin-top:20px;font-weight:bold}" +
        ".hint{text-align:center;margin-top:10px;font-size:10px;color:#999}" +
        "</style></head><body>" +
        "<h2>POINT OF SALE</h2>" +
        "<p class='sub'>" + new Date().toLocaleString() + "</p>" +
        "<p class='txid'>TX# " + txId + "</p>" +
        "<table><thead><tr>" +
        "<th>Item</th><th style='text-align:center'>Qty</th>" +
        "<th style='text-align:right'>Price</th><th style='text-align:center'>Tax%</th>" +
        "<th style='text-align:right'>Tax</th><th style='text-align:right'>Total</th>" +
        "</tr></thead>" +
        "<tbody>" + rows + "</tbody><tfoot>" +
        "<tr class='tax'><td colspan='5'>Subtotal</td><td style='text-align:right'>" + eur(sub) + "</td></tr>" +
        taxRows +
        "<tr class='tot'><td colspan='5'>TOTAL</td><td style='text-align:right'>" + eur(tot) + "</td></tr>" +
        "</tfoot></table>" +
        "<div class='ty'>\u2605 Thank you! \u2605</div>" +
        "<div class='hint'>Use &ldquo;Save as PDF&rdquo; in the print dialog to store this receipt.</div>" +
        "</body></html>"
    );
    w.document.close();
    w.focus();
    setTimeout(function () { w.print(); }, 400);
};

/* ── SAPUI5: product tile grid — data sourced from model/products.js ─────── */
sap.ui.getCore().attachInit(function () {
    sap.ui.require([
        "pos/model/products",
        "sap/m/GenericTile",
        "sap/m/TileContent",
        "sap/m/NumericContent",
        "sap/m/MessageToast",
        "sap/ui/layout/Grid"
    ], function (ProductCatalog, GenericTile, TileContent, NumericContent, MessageToast, Grid) {

        var PRODUCTS = ProductCatalog.PRODUCTS;

        var oGrid = new Grid({
            defaultSpan: "XL3 L4 M6 S12",
            hSpacing: 0.5,
            vSpacing: 0.5,
            content: PRODUCTS.map(function (p) {
                return new GenericTile({
                    header:    p.name,
                    subheader: p.category + " \u00b7 " + Math.round(p.taxRate * 100) + "%",
                    frameType: "OneByOne",
                    press: function () {
                        addItem(p);
                        MessageToast.show(p.name + " added");
                    },
                    tileContent: [
                        new TileContent({
                            content: new NumericContent({
                                value:      p.price,
                                scale:      "\u20ac",
                                valueColor: "Good",
                                indicator:  "None",
                                withMargin: false,
                                iconLoaded: false
                            })
                        })
                    ]
                }).addStyleClass("posProductTile sapUiTinyMarginBegin sapUiTinyMarginTop");
            })
        });

        oGrid.placeAt("sapCatalog");
    });
});
</script>
</body>
</html>
